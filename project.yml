name: Grimora
options:
  minimumXcodeGenVersion: 2.45.4
  createIntermediateGroups: true
packages:
  GrimoraKit:
    path: GrimoraKit
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.4
    CURRENT_PROJECT_VERSION: 2026070301
    GENERATE_INFOPLIST_FILE: YES
targets:
  GrimoraMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: GrimoraApp
        excludes:
          - AppIconComposerSources
          - GrimoraiOSInfo.plist
          - GrimoraVisionInfo.plist
    dependencies:
      - package: GrimoraKit
        product: GrimoraUI
      - package: GrimoraKit
        product: GrimoraCore
    settings:
      base:
        PRODUCT_NAME: Grimora
        PRODUCT_BUNDLE_IDENTIFIER: com.samwagner.Grimora
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Grimora
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: BJPQVZR5PZ
      configs:
        # UI tests use runner-owned fixture files; App Store builds remain sandboxed.
        Debug:
          CODE_SIGN_ENTITLEMENTS: GrimoraApp/GrimoraMacDebug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: GrimoraApp/GrimoraMac.entitlements
  GrimoraiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GrimoraApp
        excludes:
          - AppIconComposerSources
          - GrimoraiOSInfo.plist
          - GrimoraVisionInfo.plist
    dependencies:
      - package: GrimoraKit
        product: GrimoraUI
      - package: GrimoraKit
        product: GrimoraCore
    settings:
      base:
        PRODUCT_NAME: Grimora
        PRODUCT_BUNDLE_IDENTIFIER: com.samwagner.Grimora
        CODE_SIGN_ENTITLEMENTS: GrimoraApp/Grimora.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Grimora
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSCameraUsageDescription: Scry uses the camera to recognize Magic cards you point it at.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: BJPQVZR5PZ
  GrimoraVisionOS:
    type: application
    platform: visionOS
    deploymentTarget: "26.0"
    sources:
      - path: GrimoraApp
        excludes:
          - AppIconComposerSources
          - GrimoraiOSInfo.plist
          - GrimoraVisionInfo.plist
    dependencies:
      - package: GrimoraKit
        product: GrimoraUI
      - package: GrimoraKit
        product: GrimoraCore
    settings:
      base:
        PRODUCT_NAME: Grimora
        PRODUCT_BUNDLE_IDENTIFIER: com.samwagner.Grimora
        CODE_SIGN_ENTITLEMENTS: GrimoraApp/Grimora.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconVision
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GrimoraApp/GrimoraVisionInfo.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: BJPQVZR5PZ
  GrimoraEngineApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: GrimoraEngineApp
        excludes:
          - AppIconComposerSources
    dependencies:
      - package: GrimoraKit
        product: GrimoraEngineKit
      - package: GrimoraKit
        product: GrimoraCore
    settings:
      base:
        PRODUCT_NAME: Grimora Engine
        PRODUCT_BUNDLE_IDENTIFIER: com.samwagner.GrimoraEngine
        INFOPLIST_KEY_CFBundleDisplayName: Grimora Engine
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        # Local-only tool: not sandboxed so it shares the engine's state directory and Keychain
        # entries with the launchd CLI. Hardened runtime stays on for code signing.
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: GrimoraEngineApp/GrimoraEngine.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: BJPQVZR5PZ
  GrimoraScry:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GrimoraScry
    dependencies:
      - package: GrimoraKit
        product: GrimoraUI
      - package: GrimoraKit
        product: GrimoraCore
    # An explicit Info.plist (generated by XcodeGen from these properties) so it
    # can carry NSUbiquitousContainers, which the flat INFOPLIST_KEY_ settings
    # can't express. Captures write into the iCloud Drive container and sync to
    # the Mac with no manual transfer.
    info:
      path: GrimoraScry/Info.plist
      properties:
        CFBundleDisplayName: Grimora Scry
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Grimora Scry captures Magic cards to grow the recognition test corpus.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Local-fallback backstop: when iCloud is unavailable, captures still show
        # up under the phone in Finder.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Name and expose the iCloud Drive Documents folder in the Files app and
        # on the Mac; captures land here and sync automatically.
        NSUbiquitousContainers:
          iCloud.com.samwagner.GrimoraScry:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Grimora Scry
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_NAME: Grimora Scry
        PRODUCT_BUNDLE_IDENTIFIER: com.samwagner.GrimoraScry
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: GrimoraScry/GrimoraScry.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: BJPQVZR5PZ
  GrimoraMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: GrimoraUITests
    dependencies:
      - target: GrimoraMac
      - package: GrimoraKit
        product: GrimoraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samwagner.Grimora.UITests
        TEST_TARGET_NAME: GrimoraMac
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: BJPQVZR5PZ
  GrimoraiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GrimoraCrossPlatformUITests
    dependencies:
      - target: GrimoraiOS
      - package: GrimoraKit
        product: GrimoraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samwagner.Grimora.iOSUITests
        TEST_TARGET_NAME: GrimoraiOS
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: BJPQVZR5PZ
  GrimoraVisionOSUITests:
    type: bundle.ui-testing
    platform: visionOS
    deploymentTarget: "26.0"
    sources:
      - path: GrimoraCrossPlatformUITests
    dependencies:
      - target: GrimoraVisionOS
      - package: GrimoraKit
        product: GrimoraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samwagner.Grimora.VisionOSUITests
        TEST_TARGET_NAME: GrimoraVisionOS
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: BJPQVZR5PZ
schemes:
  GrimoraMac:
    build:
      targets:
        GrimoraMac: all
        GrimoraMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GrimoraMacUITests
  GrimoraEngineApp:
    build:
      targets:
        GrimoraEngineApp: all
    run:
      config: Debug
  GrimoraScry:
    build:
      targets:
        GrimoraScry: all
    run:
      config: Debug
  GrimoraiOS:
    build:
      targets:
        GrimoraiOS: all
        GrimoraiOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: GrimoraiOSUITests
          parallelizable: true
  GrimoraVisionOS:
    build:
      targets:
        GrimoraVisionOS: all
        GrimoraVisionOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: GrimoraVisionOSUITests
          parallelizable: true
